name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  windows-desktop:
    name: windows-desktop
    runs-on: windows-latest
    needs: test
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # 5.1 解析器 + UTF-8 BOM 检查：脚本在 5.1 下不解析会直接失败；
      # 没有 BOM 的 .ps1 会被按 ANSI 解码（中文乱码，CI 里不一定立刻报错）。
      - name: PowerShell syntax and BOM check (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false

          Get-ChildItem scripts/windows -Recurse -Filter *.ps1 -File | ForEach-Object {
            $file = $_

            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            }

            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            if (-not $hasBom) {
              $failed = $true
              Write-Host "::error file=$($file.FullName)::missing UTF-8 BOM (Windows PowerShell 5.1 decodes non-BOM .ps1 as ANSI)"
            } elseif ($errors.Count -eq 0) {
              Write-Host "OK: $($file.FullName)"
            }
          }

          # JSON 不能带 BOM（serde_json 解析会失败）。
          $tauriConfig = 'src-tauri/tauri.conf.json'
          if (Test-Path -LiteralPath $tauriConfig -PathType Leaf) {
            $configPath = (Resolve-Path -LiteralPath $tauriConfig).Path
            $configBytes = [System.IO.File]::ReadAllBytes($configPath)
            $configHasBom = $configBytes.Length -ge 3 -and $configBytes[0] -eq 0xEF -and $configBytes[1] -eq 0xBB -and $configBytes[2] -eq 0xBF
            if ($configHasBom) {
              $failed = $true
              Write-Host "::error file=$tauriConfig::must not have a UTF-8 BOM"
            }
          }

          if ($failed) { throw 'PowerShell syntax/BOM check failed' }

      - name: Build desktop app (Tauri NSIS + portable zip)
        shell: powershell
        run: ./scripts/windows/build-desktop.ps1 -SkipNpmCi

      - name: Upload windows-desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/windows/*.sha256
          if-no-files-found: error
          retention-days: 7

  windows-desktop-smoke:
    name: windows-desktop-smoke
    runs-on: windows-latest
    needs: windows-desktop
    timeout-minutes: 20
    steps:
      - name: Download windows-desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-desktop
          path: dist-desktop

      # 只验证“便携包里的 Node sidecar 能起来并服务 /api/health 与前端首页”，
      # 不启动 GUI（Tauri 窗口、托盘、首次初始化在 CI 里无法可靠验证）。
      - name: Extract portable package and boot the bundled sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $setup = Get-ChildItem dist-desktop -Filter '*-x64-setup.exe' -File | Select-Object -First 1
          if ($null -eq $setup) { throw 'windows-desktop artifact is missing the NSIS setup exe' }
          Write-Host "setup exe: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"

          $zip = Get-ChildItem dist-desktop -Filter '*-portable.zip' -File | Select-Object -First 1
          if ($null -eq $zip) { throw 'windows-desktop artifact is missing the portable zip' }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'llmapi-desktop-smoke'
          if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extractRoot -Force

          $packageRoot = Get-ChildItem $extractRoot -Directory | Select-Object -First 1
          if ($null -eq $packageRoot) { throw 'portable zip has no top-level directory' }
          $packageRootPath = $packageRoot.FullName
          Write-Host "extracted to: $packageRootPath"

          $appExe = Join-Path $packageRootPath 'llmapi-manager.exe'
          if (-not (Test-Path -LiteralPath $appExe -PathType Leaf)) {
            throw "portable package is missing llmapi-manager.exe: $appExe"
          }

          # 便携包布局：exe 与 runtime/ 同级；sidecar 以 runtime 为 cwd 启动。
          $runtimeDir = Join-Path $packageRootPath 'runtime'
          $nodeExe = Join-Path $runtimeDir 'node.exe'
          $serverEntry = Join-Path $runtimeDir 'server\dist\index.js'
          foreach ($required in @($nodeExe, $serverEntry, (Join-Path $runtimeDir 'web\dist\index.html'))) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "portable package is missing: $required"
            }
          }

          $dataDir = Join-Path $env:RUNNER_TEMP 'llmapi-desktop-smoke-data'
          $logDir = Join-Path $env:RUNNER_TEMP 'llmapi-desktop-smoke-log'
          if (Test-Path $dataDir) { Remove-Item $dataDir -Recurse -Force }
          if (Test-Path $logDir) { Remove-Item $logDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $encryptionKey = -join (1..64 | ForEach-Object { '{0:x}' -f (Get-Random -Maximum 16) })

          # 与 src-tauri/src/sidecar.rs 的启动方式保持一致：环境变量注入，不写 .env。
          $env:HOST = '127.0.0.1'
          $env:PORT = '8799'
          $env:PUBLIC_BASE_URL = 'http://127.0.0.1:8799'
          $env:DATA_DIR = $dataDir
          $env:LOG_DIR = $logDir
          $env:DATA_ENCRYPTION_KEY = $encryptionKey
          $env:AGENT_HOME_DIR = $env:RUNNER_TEMP
          $env:NODE_ENV = 'production'

          $stdoutLog = Join-Path $env:RUNNER_TEMP 'llmapi-desktop-smoke-stdout.log'
          $stderrLog = Join-Path $env:RUNNER_TEMP 'llmapi-desktop-smoke-stderr.log'

          $proc = Start-Process -FilePath $nodeExe `
            -ArgumentList 'server\dist\index.js' `
            -WorkingDirectory $runtimeDir `
            -WindowStyle Hidden `
            -PassThru `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog

          try {
            $health = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8799/api/health' -TimeoutSec 3 -UseBasicParsing
                if ($health.ok -eq $true) { break }
              } catch {
                $health = $null
              }
            }

            if ($null -eq $health -or $health.ok -ne $true) {
              foreach ($path in @((Join-Path $logDir 'app.log'), $stderrLog, $stdoutLog)) {
                if (Test-Path -LiteralPath $path) {
                  Write-Host "---- $path ----"
                  Get-Content -LiteralPath $path -Tail 80
                }
              }
              throw 'health check failed: /api/health did not return ok=true'
            }
            Write-Host "health: $($health | ConvertTo-Json -Compress)"
            if ($health.gatewayBaseUrl -ne 'http://127.0.0.1:8799/v1') {
              throw "unexpected gatewayBaseUrl: $($health.gatewayBaseUrl)"
            }

            $index = Invoke-WebRequest -Uri 'http://127.0.0.1:8799/' -UseBasicParsing -TimeoutSec 10
            if ($index.StatusCode -ne 200) { throw "GET / returned $($index.StatusCode)" }
            if ($index.Content -notmatch '<div id="root">') { throw 'GET / did not return the web index.html' }

            Write-Host 'windows-desktop-smoke OK: portable package extracted, bundled node.exe booted server/dist/index.js, /api/health and the web index are served'
          } finally {
            if ($null -ne $proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }
