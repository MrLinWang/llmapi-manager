[package]
name = "easytier-node"
version = "0.1.0"
edition = "2021"
# EasyTier workspace 自己声明 rust-version = "1.95"（ref/EasyTier/Cargo.toml:22）。
# 本 crate 不写死 rust-version：edition 2021 就够，真正的下限由 easytier 的
# 依赖传递上来。README 里写明了建议用 1.85+ 的工具链。
description = "N-API binding that embeds EasyTier into the llmapi-manager Node process"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# ===========================================================================
# 依赖来源（这是本 crate 唯一"非常规"的地方，务必先读完再改）
# ===========================================================================
#
# **不能写 `easytier = "2.7"`。** 已核实（2026-10-24）：
#
#   1. crates.io 上 `easytier` 的最高版本是 **2.0.3**（2024-10-13 发布），
#      根本不存在 2.7.x。`crates.io/api/v1/crates/easytier` 的 versions 列表共 10 条，
#      最高 2.0.3。
#   2. `easytier-core` / `easytier-proto` **从未发布到 crates.io**
#      （查这两个 crate 直接返回 "not found"）。也就是说 2.7 时代的多 crate 结构
#      只存在于 git 仓库里。
#   3. 更关键的是 API 完全不同。2.0.3 是"单 crate + `pub mod launcher`"的旧结构，
#      `mod instance;` 是**私有**的，也没有 `easytier-core` 这个依赖；
#      而本绑定要用的 `create_native_instance` / `TomlConfig` / `NativeCoreInstance`
#      全部在 2.7 的多 crate 结构里。
#
# 结论：只能用 **git 依赖**。
#
# 锁的是 tag `v2.7.0`（commit `8b7f1f0196ed`），不是 main 分支快照。
#
# **为什么锁 tag 而不是 main tip**：本 crate 只用 v2.7.0 tag 里就有的 API
# （`create_native_instance`、`TomlConfig` 的 setter、`get_flags`/`set_flags`）。
# 曾经用过 `patch_flags(FlagsPatch{..})`，但那个 API 来自 PR #2585，只在 main 上、
# 没进 tag——用它意味着永远依赖一个未发布的分支快照，上游一动就得改 rev，
# 对外发版时也没有稳定版本可依赖。改用 `get_flags()`/`set_flags()` 之后，
# 锁 tag 就足够了（官方 easytier-uptime/src/health_checker.rs:399 也是这么写的）。
#
# 如果将来需要 main 上的新功能，把 `tag = "v2.7.0"` 换成
# `rev = "<具体 commit>"`，并在这里补一句换了什么、为什么。
#
# 参考源码位置（都是相对 ref/EasyTier/）：
#   easytier/Cargo.toml:323          [features] 定义
#   easytier/src/instance/factory.rs:52   create_native_instance（无 feature 门控）
#   easytier/src/instance/factory.rs:38-39 native_instance_manager（需 management-rpc）
#   easytier-core/src/config/toml.rs:28   ConfigLoader trait
#   easytier-core/src/config/toml.rs:21   pub use {Flags, FlagsPatch}

[dependencies]
# url：构造监听地址（`TomlConfig::set_listeners` 收 `Vec<url::Url>`）。
# 版本与 easytier 内部使用的保持一致，避免出现两个 url crate。
url = "2"
easytier = { git = "https://github.com/EasyTier/EasyTier.git", tag = "v2.7.0", default-features = false, features = [
  "tun",
  "wireguard",
  "quic",
  "aes-gcm",
  # logging 必须开：EasyTier 的故障几乎全是**静默**的（两个节点都 running
  # 却永远 peerCount=0），原因可能是握手失败/路由没收敛/中继不可达/NAT 不兼容，
  # 这些只在它内部日志里说。不开这个 feature 时连 `common::log` 模块都不存在，
  # 上层只能看到"启动了但没用"，完全无从定位。
  "logging",
  # smoltcp：**必需**。`no_tun = true` 时 EasyTier 走用户态协议栈
  # （`instance/config.rs:324` 的 `force_smoltcp` 分支）。没有这个 feature，
  # 关掉 TUN 就等于关掉网络层——节点会显示 running 但连不上任何人。
  "smoltcp",
  # tcp-hole-punch：TCP 打洞。两端都在 NAT 后时靠它建连；
  # 缺了它就只能等对端直连或走中继。
  "tcp-hole-punch",
] }

# napi 3.x：与 `@napi-rs/cli` 3.x 配套（已核实 crates.io：napi 3.15.0、
# napi-derive 3.6.13、napi-build 2.6.0）。
# feature 都逐个核对过存在（napi 3.15.0 的 features 表）：
#   napi8        -> 目标 Node ABI 8（Node 16+）
#   async        -> 启用 async fn 支持（依赖 tokio_rt）
#   tokio_rt     -> 提供 tokio 运行时给 `#[napi] async fn`
#   serde-json   -> 若将来要直接传 serde_json::Value
#   error_anyhow -> 让 `anyhow::Error` 能直接 `.into()` 成 `napi::Error`
napi = { version = "3", default-features = false, features = [
  "napi8",
  "async",
  "tokio_rt",
  "serde-json",
  "error_anyhow",
] }
napi-derive = "3"

# tokio：只要 rt-multi-thread（提供运行时）、time（停机分段超时）、
# sync（Mutex 串行化 start/stop）。不引 net/fs/process —— 本 crate 不做 IO。
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "sync",
  "time",
] }

anyhow = "1"
# once_cell 用于 `Lazy<Mutex<Option<Arc<..>>>>` 单例。
# （std 的 `LazyLock` 从 1.80 稳定，若愿意抬工具链下限可换成它并去掉此依赖。）
once_cell = "1"

[build-dependencies]
napi-build = "2"
