[package]
name = "protocol-oracle"
version = "0.1.0"
edition = "2021"
publish = false

# 这个 crate 不是产品代码，是**测试基准**。
#
# 它直接链接官方的 easytier-core，把真实的结构体字节序列化出来，供 TypeScript
# 那份"自研协议实现"做逐字节对照。有了它，"我们理解的协议"就不是靠读源码猜的，
# 而是与官方实现对过的。
#
# 为什么单独一个 crate 而不是加在 easytier-node 里：
# 1. 它是构建期工具，不该进 Node 原生模块的产物
# 2. 只依赖 easytier-core（不需要 tun/wireguard 那些 heavyweight feature），
#    编译很快
[dependencies]
# Flags 与 gen_default_flags 在 easytier crate 里（不是 easytier-core）
easytier = { git = "https://github.com/EasyTier/EasyTier.git", tag = "v2.7.0", default-features = false }
easytier-core = { git = "https://github.com/EasyTier/EasyTier.git", tag = "v2.7.0", default-features = false }
# proto 类型（RoutePeerInfo / TrustedCredentialPubkey）在这里。
# 凭证的 HMAC 是对它们的 protobuf 编码签名的，所以要直接依赖。
easytier-proto = { git = "https://github.com/EasyTier/EasyTier.git", tag = "v2.7.0", default-features = false }
zerocopy = { version = "0.7", features = ["derive"] }
serde_json = "1"

# snow：与 easytier-core 完全相同的 Noise 实现与版本（0.10.0）。
# 用它跑真实握手，验证 TS 侧给出的 pattern / prologue 参数是可行的。
snow = { version = "0.10.0", features = ["default-resolver"] }
hex = "0.4"

# 凭证的 HMAC 是对**protobuf 序列化结果**签名的，所以要能调 encode_to_vec()。
# prost 由 easytier-proto 传递依赖进来，这里显式声明以便直接用它的 Message trait。
prost = "0.14"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
