<!doctype html>
<!--
  lang="zh-CN" 只是首帧的静态默认值：真正的语言由 web/src/i18n 在模块加载时
  按服务端设置（或浏览器语言）同步到 <html lang>，这里是给"JS 还没执行"和
  "纯爬虫/无 JS 环境"看的。改它不会影响界面语言，别在这里做语言判断。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM API Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
